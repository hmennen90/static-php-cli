name: Build SPC Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/release-build.yml'
  release:
    types:
      - published
  workflow_dispatch:

env:
  PHP_VERSION: 8.4
  MICRO_VERSION: 8.4.11

jobs:
  build-release-artifacts:
    name: "Build SPC Binary for ${{ matrix.operating-system.name }}"
    runs-on: ${{ matrix.operating-system.os }}
    strategy:
      matrix:
        operating-system:
          - name: "linux-x86_64"
            os: "ubuntu-latest"
            filename: "spc-linux-x86_64.tar.gz"
          - name: "macos-x86_64"
            os: "macos-15-intel"
            filename: "spc-macos-x86_64.tar.gz"
          - name: "linux-aarch64"
            os: "ubuntu-latest"
            filename: "spc-linux-aarch64.tar.gz"
          - name: "macos-aarch64"
            os: "macos-14"
            filename: "spc-macos-aarch64.tar.gz"
          - name: "windows-x64"
            os: "ubuntu-latest"
            filename: "spc-windows-x64.exe"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - if: inputs.debug == true
        run: echo "SPC_BUILD_DEBUG=--debug" >> $GITHUB_ENV

      # Homebrew dropped Intel macOS and shivammathur/setup-php followed
      # (shivammathur/setup-php#1112): on macos-15-intel it hangs ~25 min and
      # fails. Same way out as build-static-php-cli.yml: a static-php-cli CLI
      # build as host PHP, Composer pinned to 2.8.12 (2.9's HTTP/3 aborts the
      # static libcurl, composer#12681). PHPRC carries memory_limit=-1, which
      # setup-php's ini-values set for the other runners.
      - name: "Install PHP (static CLI, macos-x86_64)"
        if: matrix.operating-system.os == 'macos-15-intel'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/static-php/bin"
          curl -fsSL -o /tmp/php-cli.tar.gz \
            https://dl.static-php.dev/static-php-cli/common/php-8.5.8-cli-macos-x86_64.tar.gz
          tar -xzf /tmp/php-cli.tar.gz -C "$HOME/static-php/bin"
          chmod +x "$HOME/static-php/bin/php"
          curl -fsSL -o "$HOME/static-php/bin/composer" https://getcomposer.org/download/2.8.12/composer.phar
          chmod +x "$HOME/static-php/bin/composer"
          echo "memory_limit=-1" > "$HOME/static-php/php.ini"
          echo "PHPRC=$HOME/static-php" >> "$GITHUB_ENV"
          echo "$HOME/static-php/bin" >> "$GITHUB_PATH"
          PHPRC="$HOME/static-php" "$HOME/static-php/bin/php" -r 'echo PHP_VERSION, " memory_limit=", ini_get("memory_limit"), "\n";'
          "$HOME/static-php/bin/php" -m | tr '\n' ' '; echo

      - name: "Install PHP for official runners"
        if: matrix.operating-system.os != 'macos-15-intel'
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          tools: composer:v2
          php-version: "${{ env.PHP_VERSION }}"
          ini-values: memory_limit=-1
          extensions: curl, openssl, mbstring

      - name: "Get Composer Cache Directory"
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "Cache Composer dependencies"
        uses: "actions/cache@v4"
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "php-${{ env.PHP_VERSION }}-locked-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            php-${{ env.PHP_VERSION }}-locked-composer

      - name: "Install Locked Dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Build PHAR File"
        run: "composer build:phar"

      - name: "Download Minimal Combination"
        run: |
          if [ "${{ matrix.operating-system.name }}" = "windows-x64" ]; then
            curl -fsSL https://dl.static-php.dev/static-php-cli/windows/spc-min/php-${{ env.MICRO_VERSION }}-micro-win.zip -o tmp.zip
            unzip tmp.zip
          else
            curl -fsSL https://dl.static-php.dev/static-php-cli/minimal/php-${{ env.MICRO_VERSION }}-micro-${{ matrix.operating-system.name }}.tar.gz -o tmp.tgz
            tar -zxvf tmp.tgz
          fi

      - name: "Generate Executable"
        run: |
          bin/spc micro:combine spc.phar -M micro.sfx -O spc -I "memory_limit=2G"
          if [ "${{ matrix.operating-system.name }}" = "windows-x64" ]; then
            mv spc spc.exe
          else
            chmod +x spc
          fi
          if [ "${{ matrix.operating-system.name }}" = "macos-aarch64" ] || [ "${{ matrix.operating-system.name }}" = "macos-x86_64" ]; then
             sudo xattr -cr ./spc
          fi

      - name: "Archive Executable and Validate Binary"
        run: |
          if [ "${{ matrix.operating-system.name }}" != "windows-x64" ]; then
            tar -czf ${{ matrix.operating-system.filename }} spc
            # validate spc binary
            if [ "${{ matrix.operating-system.name }}" == "linux-x86_64" ]; then
              ./spc dev:extensions
            fi
          fi

      - name: "Copy file"
        run: |
          if [ "${{ matrix.operating-system.name }}" != "windows-x64" ]; then
            mkdir dist/ && cp ${{ matrix.operating-system.filename }} dist/ && cp spc dist/spc-${{ matrix.operating-system.name }}
          else
            mkdir dist/ && cp spc.exe dist/${{ matrix.operating-system.filename }}
            echo "SUFFIX=.exe" >> $GITHUB_ENV
          fi

      - name: "Upload Binaries to Release"
        uses: softprops/action-gh-release@v1
        if: ${{startsWith(github.ref, 'refs/tags/') }}
        with:
          files: dist/${{ matrix.operating-system.filename }}

      - name: "Deploy to self-hosted OSS"
        # only run this step if the repository is static-php-cli and the branch is main
        if: github.repository == 'crazywhalecc/static-php-cli' && github.ref == 'refs/heads/main'
        uses: static-php/upload-s3-action@v1.0.0
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: "dist/"
          destination_dir: static-php-cli/spc-bin/nightly/
          endpoint: ${{ secrets.AWS_ENDPOINT }}

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          path: spc${{ env.SUFFIX }}
          name: spc-${{ matrix.operating-system.name }}${{ env.SUFFIX }}
  test-spc:
    name: "Test SPC Binary for ${{ matrix.operating-system.name }}"
    runs-on: ${{ matrix.operating-system.os }}
    needs: [build-release-artifacts]
    strategy:
      matrix:
        operating-system:
          - name: "linux-x86_64"
            os: "ubuntu-latest"
          - name: "macos-x86_64"
            os: "macos-15-intel"
          - name: "linux-aarch64"
            os: "ubuntu-24.04-arm"
          - name: "macos-aarch64"
            os: "macos-15"
          - name: "windows-x64"
            os: "windows-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download Artifact"
        uses: actions/download-artifact@v4
        env:
          SUFFIX: ${{ matrix.operating-system.name == 'windows-x64' && '.exe' || '' }}
        with:
          name: spc-${{ matrix.operating-system.name }}${{ env.SUFFIX }}

      - name: "Chmod"
        if: matrix.operating-system.name != 'windows-x64'
        run: chmod +x spc

      - name: "Run SPC Tests"
        env:
          SUFFIX: ${{ matrix.operating-system.name == 'windows-x64' && '.exe' || '' }}
        run: ./spc${{ env.SUFFIX }} dev:extensions
